name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: extractions/setup-just@v4
        with:
          just-version: '1.46.0'
      - name: Install the Docker-pinned rclone for integration tests
        shell: bash
        run: |
          rclone_version="$(sed -n 's/^FROM rclone\/rclone:\([^ ]*\) AS rclone$/\1/p' Dockerfile)"
          test -n "$rclone_version"
          case "$(uname -s)" in Linux) rclone_os=linux ;; Darwin) rclone_os=osx ;; *) exit 1 ;; esac
          case "$(uname -m)" in x86_64) rclone_arch=amd64 ;; arm64|aarch64) rclone_arch=arm64 ;; *) exit 1 ;; esac
          rclone_archive="rclone-v${rclone_version}-${rclone_os}-${rclone_arch}"
          curl -fsSL "https://downloads.rclone.org/v${rclone_version}/${rclone_archive}.zip" -o "${RUNNER_TEMP}/rclone.zip"
          unzip -q "${RUNNER_TEMP}/rclone.zip" -d "$RUNNER_TEMP"
          "${RUNNER_TEMP}/${rclone_archive}/rclone" version
          echo "${RUNNER_TEMP}/${rclone_archive}" >> "$GITHUB_PATH"
      - run: just test build

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
