[server]
# For a local Go process, use 127.0.0.1:8080. Compose publishes only to loopback.
listen_addr = "0.0.0.0:8080"

[[plugins.sources]]
id = "nyaa"
type = "nyaa"
base_url = "https://sukebei.nyaa.si/"
f = 0
c = "0_0"

[[plugins.sources]]
id = "catalog"
type = "javdb"
# base_url defaults to https://jdforrepam.com/api.

# Remove this entry for search-only operation.
[[plugins.downloaders]]
id = "pikpak"
type = "pikpak-rclone"
# rc_socket defaults to a private per-user directory under the OS temporary directory.
# Set an absolute path to use a specific socket.
remote = "pikpak:My Pack"

[dav_cache]
# Defaults to metadonalds/dav under the OS user cache directory.
# Set an absolute dedicated directory to override; dir = "" disables persistence.
refresh = true
