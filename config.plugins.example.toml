# Explicit instances replace the default Nyaa + JavDB + PikPak selection.
# This example uses the custom downloader ID personal; legacy defaults use pikpak.
# Remove the catalog entry to opt out of JavDB; no instances are added implicitly.
[server]
listen_addr = "127.0.0.1:8080"

[plugins]
# These optional defaults serve the legacy /api/v1/search and /api/v1/submit APIs.
default_source = "nyaa"
default_downloader = "personal"

[[plugins.sources]]
id = "nyaa"
type = "nyaa"
base_url = "https://sukebei.nyaa.si/"
f = 0
c = "0_0"

[[plugins.sources]]
id = "catalog"
type = "javdb"
# base_url defaults to https://jdforrepam.com/api; anonymous read protocol.

# For search-only operation, remove this entry and default_downloader above.
[[plugins.downloaders]]
id = "personal"
type = "pikpak-rclone"
rc_socket = "/tmp/metadonalds/rclone.sock"
remote = "pikpak:My Pack"

[dav_cache]
# Defaults to metadonalds/dav under the OS user cache directory.
# Set an absolute dedicated directory to override; dir = "" disables persistence.
# dir = "/var/cache/metadonalds/dav"
refresh = true # Refresh recently accessed directories in the background.
