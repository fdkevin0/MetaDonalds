services:
  metadonalds:
    image: ghcr.io/fdkevin0/metadonalds:latest
    command: ["serve", "--config", "/etc/metadonalds/config.toml"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      RCLONE_CONFIG: /config/rclone/rclone.conf
      METADONALDS_DAV_CACHE_DIR: /cache/dav
    volumes:
      - ./config.toml:/etc/metadonalds/config.toml:ro
      - ./rclone:/config/rclone
      - dav-cache:/cache
    tmpfs:
      - /tmp:mode=1777
    stop_grace_period: 15s

volumes:
  dav-cache:
